<!DOCTYPE html>
<html lang="es">
    
<head>
<link rel="stylesheet" href="style.css">    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencia de Viajes Mares</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#081b29;
            color:white;
        }

        .hero{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;

            background:
            linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),
            url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=80");

            background-size:cover;
            background-position:center;

        }

        h1{

            font-size:72px;
            margin-bottom:20px;

        }

        p{

            font-size:22px;
            max-width:700px;
            margin:auto;

        }

        .boton{

            display:inline-block;
            margin-top:40px;
            padding:18px 45px;
            background:white;
            color:#081b29;
            text-decoration:none;
            border-radius:40px;
            font-weight:bold;

        }

    </style>

</head>

<body>

<section class="hero">

<div>

<h1>
Agencia de Viajes Mares
</h1>

<p>

Próximamente una experiencia web de lujo.

</p>

<a class="boton" href="#">

Explorar

</a>

</div>

</section>
<script src="script.js"></script>

</body>

</html>
